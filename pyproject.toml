[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-trend-agent"
version = "0.2.0"
description = "A reproducible three-agent workflow for arXiv trend scans with optional PDF parsing and a local web app."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Kaili Shi" }]
keywords = ["agents", "arxiv", "literature-review", "research-trends"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["certifi>=2024.8.30"]

[project.optional-dependencies]
ai = [
  "openai>=2.0.0",
  "pydantic>=2.7.0",
]
pdf = ["pymupdf>=1.24.0"]
web = [
  "fastapi>=0.115.0",
  "pymupdf>=1.24.0",
  "uvicorn>=0.30.0",
]
app = [
  "fastapi>=0.115.0",
  "openai>=2.0.0",
  "pydantic>=2.7.0",
  "pymupdf>=1.24.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
arxiv-trends = "arxiv_trend_agent.cli:main"
arxiv-trends-web = "arxiv_trend_agent.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arxiv_trend_agent = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

